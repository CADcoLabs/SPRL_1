[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=modules
    --cov=core
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    --strict-markers
    --strict-config
markers = 
    integration: Integration tests requiring AutoCAD interface
    unit: Unit tests using mock interfaces only
    performance: Performance benchmark tests
    ibc: IBC building code compliance validation tests
    security: Security-focused tests for input validation
    slow: Tests that take longer than 1 second to execute